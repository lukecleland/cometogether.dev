<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=tiles-2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=tiles-2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=tiles-2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=tiles-2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Add to Home Screen. iOS ignores the manifest's icons and reads
         apple-touch-icon instead, so both are needed. -->
    <link rel="manifest" href="/manifest.webmanifest?v=tiles-2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=tiles-2" />
    <meta name="theme-color" content="#101014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Make Together" />
    <!-- Black-translucent lets the canvas run under the status bar, which the
         existing viewport-fit=cover + safe-area insets already account for. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="description" content="Video chat, share media, draw and make music together on a shared canvas. Create a room on Make Together — no account required." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Make Together" />
    <meta property="og:title" content="Make Together" />
    <meta property="og:description" content="A shared space for video chat, ideas and making music. Jump in together — no account needed." />
    <!-- Keep metadata in the initial HTML so link crawlers need no JavaScript.
         Do not canonicalize room links to the homepage: invitations must retain ?room=. -->
    <meta property="og:image" content="https://maketogether.dev/social-preview-v1.png" />
    <meta property="og:image:secure_url" content="https://maketogether.dev/social-preview-v1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Make Together — video chat, shared canvas, music and ideas. No account needed." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://maketogether.dev/social-preview-v1.png" />
    <meta name="twitter:image:alt" content="Make Together — good things happen together." />
    <meta name="twitter:title" content="Make Together" />
    <meta name="twitter:description" content="A shared space for video chat, ideas and making music. Jump in together — no account needed." />
    <title>Make Together</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
