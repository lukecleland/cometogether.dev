<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Add to Home Screen. iOS ignores the manifest's icons and reads
         apple-touch-icon instead, so both are needed. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="cometogether.dev" />
    <!-- Black-translucent lets the canvas run under the status bar, which the
         existing viewport-fit=cover + safe-area insets already account for. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="description" content="Video chat, share media, draw and make music together on a shared canvas. Create a room on cometogether.dev — no account required." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="cometogether.dev" />
    <meta property="og:title" content="cometogether.dev" />
    <meta property="og:description" content="Video chat, share media, draw and make music together on a shared canvas. No account required." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="cometogether.dev" />
    <meta name="twitter:description" content="Video chat, share media, draw and make music together on a shared canvas. No account required." />
    <title>cometogether.dev</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
